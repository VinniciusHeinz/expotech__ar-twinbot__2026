<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>AR-TwinBot - Digital Twin</title>

    <script src="https://cdn.jsdelivr.net/npm/three@0.136.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.5/dist/mindar-image-three.prod.js"></script>

    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: transparent !important;
        font-family: monospace;
      }
      #overlay {
        position: absolute;
        top: 12px;
        left: 12px;
        color: #00ffcc;
        z-index: 10;
        pointer-events: none;
      }
      #ar-container {
        width: 100vw;
        height: 100vh;
        position: relative;
        overflow: hidden;
      }
      /* Força a tag de vídeo criada pelo MindAR a ocupar toda a tela e ficar no fundo */
      #ar-container video {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        object-fit: cover !important;
        z-index: 1 !important;
      }
      /* Força a camada 3D do Three.js a ficar transparente e sobre o vídeo */
      #ar-container canvas {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        z-index: 2 !important;
      }
      #start-btn {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 16px 28px;
        background-color: #00ffcc;
        color: #000;
        font-weight: bold;
        font-size: 16px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        z-index: 20;
        box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
      }
    </style>
  </head>
  <body>
    <div id="overlay">
      <h3>AR-TwinBot Telemetry</h3>
      <p id="status">Clique no botão para abrir a câmera</p>
    </div>

    <button id="start-btn">INICIAR CÂMARA AR</button>
    <div id="ar-container"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
