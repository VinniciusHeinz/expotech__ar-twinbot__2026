<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>AR-TwinBot - Digital Twin</title>

    <link rel="stylesheet" href="/src/style.css" />

    <!-- Three.js, OrbitControls e MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.136.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.136.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.5/dist/mindar-image-three.prod.js"></script>

    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0b0f19 !important;
        font-family: monospace;
        user-select: none;
        -webkit-user-select: none;
      }

      /* Painel HUD Semitransparente com Desfoque */
      #telemetry-panel {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 1000;
        background: rgba(15, 23, 42, 0.78);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(0, 255, 204, 0.35);
        border-radius: 12px;
        padding: 14px 18px;
        color: #f1f5f9;
        font-size: 13px;
        line-height: 1.6;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
        max-width: 260px;
        pointer-events: none;
      }

      #telemetry-panel h3 {
        margin: 0 0 8px 0;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 1.5px;
        color: #00ffcc;
        text-transform: uppercase;
        border-bottom: 1px solid rgba(0, 255, 204, 0.25);
        padding-bottom: 4px;
      }

      #status {
        margin: 0;
        word-break: break-word;
      }

      /* Barra superior para alternar entre modos e Admin */
      #top-bar {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 1000;
        display: flex;
        gap: 6px;
        background: rgba(15, 23, 42, 0.78);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        padding: 6px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.15);
      }

      #mode-switcher {
        display: none;
        gap: 6px;
      }

      .switch-btn {
        background: transparent;
        color: #94a3b8;
        border: none;
        padding: 8px 10px;
        border-radius: 6px;
        font-family: monospace;
        font-size: 12px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.2s;
      }

      .switch-btn.active {
        background: #00ffcc;
        color: #0f172a;
        box-shadow: 0 0 12px rgba(0, 255, 204, 0.4);
      }

      #btn-admin-login {
        border: 1px solid rgba(255, 170, 0, 0.4);
        color: #ffaa00;
      }

      #btn-admin-login.logged-in {
        background: #ffaa00;
        color: #0f172a;
        box-shadow: 0 0 12px rgba(255, 170, 0, 0.4);
      }

      /* Modal de Login Admin */
      #login-modal {
        position: fixed;
        inset: 0;
        z-index: 10000;
        background: rgba(0, 0, 0, 0.75);
        backdrop-filter: blur(6px);
        display: none;
        align-items: center;
        justify-content: center;
      }

      .modal-box {
        background: #0f172a;
        border: 1px solid #00ffcc;
        border-radius: 14px;
        padding: 24px;
        width: 85%;
        max-width: 320px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
        color: #f1f5f9;
      }

      .modal-box h4 {
        margin: 0 0 16px 0;
        color: #00ffcc;
        font-size: 15px;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      .modal-input {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        margin-bottom: 12px;
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 8px;
        color: #fff;
        font-family: monospace;
        font-size: 14px;
      }

      .modal-actions {
        display: flex;
        gap: 10px;
        margin-top: 8px;
      }

      .modal-btn {
        flex: 1;
        padding: 10px;
        border: none;
        border-radius: 8px;
        font-family: monospace;
        font-weight: bold;
        cursor: pointer;
      }

      #login-submit {
        background: #00ffcc;
        color: #0f172a;
      }

      #login-cancel {
        background: #334155;
        color: #f1f5f9;
      }

      #login-error {
        color: #ff2244;
        font-size: 12px;
        margin-bottom: 10px;
        display: none;
      }

      /* Painel de Controlo Admin (D-Pad) */
      #admin-panel {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 2000;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 170, 0, 0.45);
        border-radius: 16px;
        padding: 14px;
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      }

      #toggle-drive-mode {
        width: 100%;
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid #00ffcc;
        background: rgba(0, 255, 204, 0.15);
        color: #00ffcc;
        font-family: monospace;
        font-weight: bold;
        font-size: 12px;
        cursor: pointer;
      }

      #toggle-drive-mode.manual-active {
        border-color: #ffaa00;
        background: rgba(255, 170, 0, 0.2);
        color: #ffaa00;
      }

      .dpad-grid {
        display: grid;
        grid-template-columns: repeat(3, 52px);
        grid-template-rows: repeat(3, 52px);
        gap: 6px;
        opacity: 0.4;
        pointer-events: none;
        transition: opacity 0.2s;
      }

      .dpad-grid.enabled {
        opacity: 1;
        pointer-events: auto;
      }

      .dpad-btn {
        background: #1e293b;
        border: 1px solid #475569;
        border-radius: 10px;
        color: #f8fafc;
        font-size: 18px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
      }

      .dpad-btn:active, .dpad-btn.pressed {
        background: #ffaa00;
        color: #0f172a;
        border-color: #ffaa00;
        transform: scale(0.95);
      }

      .dpad-stop {
        background: rgba(255, 34, 68, 0.2);
        border-color: #ff2244;
        color: #ff2244;
        font-size: 12px;
      }

      /* Containers de visualização */
      #ar-container, #orbit-container {
        width: 100vw;
        height: 100vh;
        position: absolute;
        top: 0;
        left: 0;
        overflow: hidden;
      }

      #orbit-container {
        display: none;
        z-index: 5;
        background: radial-gradient(circle at center, #1e293b 0%, #090d16 100%);
      }

      #orbit-hint {
        position: fixed;
        bottom: 20px;
        left: 16px;
        z-index: 1000;
        color: rgba(241, 245, 249, 0.6);
        background: rgba(15, 23, 42, 0.6);
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 11px;
        pointer-events: none;
        display: none;
      }

      #ar-container video {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        object-fit: cover !important;
        z-index: 1 !important;
      }

      #ar-container canvas {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        z-index: 2 !important;
      }

      /* Menu inicial de escolha de modo */
      #start-menu {
        position: fixed;
        bottom: 32px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
        width: 90%;
        max-width: 460px;
      }

      .action-btn {
        flex: 1;
        min-width: 180px;
        padding: 15px 20px;
        font-family: monospace;
        font-weight: bold;
        font-size: 14px;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        text-align: center;
      }

      #start-ar-btn {
        background-color: #00ffcc;
        color: #0f172a;
        box-shadow: 0 4px 20px rgba(0, 255, 204, 0.4);
      }

      #start-orbit-btn {
        background-color: rgba(30, 41, 59, 0.9);
        color: #00ffcc;
        border: 1px solid #00ffcc;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      }

      .action-btn:active {
        transform: scale(0.96);
      }
    </style>
  </head>
  <body>
    <!-- Painel de Telemetria -->
    <div id="telemetry-panel">
      <h3>AR-TwinBot Telemetry</h3>
      <div id="status">Conectando ao ESP32...</div>
    </div>

    <!-- Barra Superior (Alternador + Botão Admin) -->
    <div id="top-bar">
      <div id="mode-switcher">
        <button id="btn-mode-ar" class="switch-btn">📷 AR</button>
        <button id="btn-mode-orbit" class="switch-btn">🪐 3D</button>
      </div>
      <button id="btn-admin-login" class="switch-btn">🔒 ADMIN</button>
    </div>

    <!-- Modal de Autenticação Admin -->
    <div id="login-modal">
      <div class="modal-box">
        <h4>🔒 Acesso Admin</h4>
        <div id="login-error">Utilizador ou senha incorretos!</div>
        <input type="text" id="admin-user" class="modal-input" placeholder="Utilizador" autocomplete="off" />
        <input type="password" id="admin-pass" class="modal-input" placeholder="Palavra-passe" />
        <div class="modal-actions">
          <button id="login-cancel" class="modal-btn">Cancelar</button>
          <button id="login-submit" class="modal-btn">Entrar</button>
        </div>
      </div>
    </div>

    <!-- Painel de Controlo Remoto (Visível após Login) -->
    <div id="admin-panel">
      <button id="toggle-drive-mode">🤖 MODO: AUTÓNOMO</button>
      <div id="dpad-container" class="dpad-grid">
        <div></div>
        <button class="dpad-btn" data-dir="FORWARD">▲</button>
        <div></div>
        <button class="dpad-btn" data-dir="LEFT">◄</button>
        <button class="dpad-btn dpad-stop" data-dir="STOP">STOP</button>
        <button class="dpad-btn" data-dir="RIGHT">►</button>
        <div></div>
        <button class="dpad-btn" data-dir="REVERSE">▼</button>
        <div></div>
      </div>
    </div>

    <!-- Botões Iniciais -->
    <div id="start-menu">
      <button id="start-ar-btn" class="action-btn">📷 CÂMERA AR</button>
      <button id="start-orbit-btn" class="action-btn">🪐 INSPEÇÃO 3D</button>
    </div>

    <!-- Dica de Rotação no Modo 3D -->
    <div id="orbit-hint">Arraste: Girar 360° • Pinça/Scroll: Zoom</div>

    <!-- Containers -->
    <div id="ar-container"></div>
    <div id="orbit-container"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
